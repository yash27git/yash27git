<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">YAASH | Open-source developer and cybersecurity learner</title>
  <desc id="desc">A dark midnight-blue technology banner with electric blue and teal gradients, circuit paths, a terminal window, and a shield emblem.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset="0.52" stop-color="#101b35"/>
      <stop offset="1" stop-color="#071f2b"/>
    </linearGradient>
    <linearGradient id="blueTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8295ff"/>
      <stop offset="0.52" stop-color="#47bfff"/>
      <stop offset="1" stop-color="#45e0c0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172747" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0a1729" stop-opacity=".96"/>
    </linearGradient>
    <radialGradient id="blueGlow"><stop offset="0" stop-color="#536dff" stop-opacity=".34"/><stop offset="1" stop-color="#536dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="tealGlow"><stop offset="0" stop-color="#20d5c0" stop-opacity=".22"/><stop offset="1" stop-color="#20d5c0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b7cbff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#background)"/>
  <rect width="1200" height="380" rx="26" fill="url(#grid)"/>
  <circle cx="1000" cy="120" r="310" fill="url(#blueGlow)"/>
  <circle cx="1100" cy="340" r="260" fill="url(#tealGlow)"/>

  <g fill="none" stroke="url(#blueTeal)" stroke-width="1.4" opacity=".27">
    <path d="M0 48H330L370 88H510"/>
    <path d="M0 68H245L278 101H390"/>
    <path d="M0 310H286L330 266H440"/>
    <path d="M760 40H845L875 70H1200"/>
    <path d="M840 350H930L970 310H1200"/>
    <path d="M1120 0V62L1084 98V144"/>
    <path d="M1180 176H1136L1102 210H1030"/>
  </g>
  <g fill="#5fd8df" opacity=".8">
    <circle cx="510" cy="88" r="3"/><circle cx="390" cy="101" r="3"/>
    <circle cx="440" cy="266" r="3"/><circle cx="875" cy="70" r="3"/>
    <circle cx="970" cy="310" r="3"/><circle cx="1030" cy="210" r="3"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="78" y="76" fill="#91a8d4" font-size="14" font-weight="700" letter-spacing="4">OPEN SOURCE  /  SOFTWARE ENGINEERING</text>
    <text x="72" y="178" fill="#f4f7ff" font-size="88" font-weight="800" letter-spacing="-4">YAASH</text>
    <rect x="80" y="204" width="92" height="5" rx="2.5" fill="url(#blueTeal)"/>
    <text x="80" y="250" fill="#d1dcf4" font-size="22" font-weight="600">Open-source contributor · Cybersecurity learner</text>
    <text x="80" y="286" fill="#94a9cf" font-size="17" font-weight="500">C++  /  Go  /  TypeScript  /  Python  /  Linux</text>
    <text x="80" y="333" fill="#7086ad" font-size="12" font-weight="700" letter-spacing="2.3">LEARN DEEPLY. BUILD CAREFULLY. TEST THE EDGE CASES.</text>
  </g>

  <g transform="translate(845 66)">
    <circle cx="132" cy="122" r="142" fill="none" stroke="#5b82ff" stroke-opacity=".16" stroke-width="1.5"/>
    <circle cx="132" cy="122" r="116" fill="none" stroke="#56d9d0" stroke-opacity=".23" stroke-width="1.2" stroke-dasharray="4 9"/>
    <circle cx="132" cy="122" r="91" fill="none" stroke="#8aa6ff" stroke-opacity=".18"/>
    <rect x="42" y="55" width="180" height="125" rx="13" fill="url(#panel)" stroke="#81a7ff" stroke-opacity=".55" stroke-width="1.4"/>
    <path d="M42 83H222" stroke="#81a7ff" stroke-opacity=".35"/>
    <circle cx="60" cy="69" r="3.5" fill="#ff7f91"/><circle cx="73" cy="69" r="3.5" fill="#ffd27b"/><circle cx="86" cy="69" r="3.5" fill="#55d9b2"/>
    <path d="M68 111L82 123L68 135M94 136H125" fill="none" stroke="url(#blueTeal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="158" fill="#89a2ce" font-size="10" font-family="monospace">build · test · repeat</text>
    <path d="M132 195L174 211V245C174 274 154 296 132 307C110 296 90 274 90 245V211L132 195Z" fill="#10253b" stroke="url(#blueTeal)" stroke-width="2.5"/>
    <path d="M116 250L128 262L151 235" fill="none" stroke="#65e5c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g opacity=".7">
    <circle cx="1082" cy="36" r="4" fill="#59dfca"/>
    <circle cx="1160" cy="120" r="3" fill="#8ca0ff"/>
    <circle cx="790" cy="293" r="3" fill="#5cc8ff"/>
    <circle cx="1048" cy="340" r="4" fill="#59dfca"/>
  </g>
</svg>