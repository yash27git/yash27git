<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">YAASH profile banner</title>
  <desc id="desc">A dark navy banner with electric blue and teal gradients, abstract rings, and the name YAASH.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#082b3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="0.55" stop-color="#4cbdff"/>
      <stop offset="1" stop-color="#50e3c2"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#526dff" stop-opacity="0.36"/><stop offset="1" stop-color="#526dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#20c7c7" stop-opacity="0.25"/><stop offset="1" stop-color="#20c7c7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#a9c5ff" stroke-opacity="0.07" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="980" cy="70" r="285" fill="url(#glowA)"/>
  <circle cx="1120" cy="280" r="270" fill="url(#glowB)"/>
  <g fill="none" stroke="url(#accent)" stroke-opacity="0.48">
    <circle cx="1010" cy="150" r="142" stroke-width="1.5"/>
    <circle cx="1010" cy="150" r="112" stroke-width="1" stroke-dasharray="5 10"/>
    <circle cx="1010" cy="150" r="82" stroke-width="1"/>
    <path d="M840 150H1180M1010 -20V320" stroke-opacity="0.22"/>
  </g>
  <path d="M0 272 C210 220 340 330 560 270 S900 220 1200 270" fill="none" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="2"/>
  <path d="M0 286 C230 236 360 340 585 286 S930 238 1200 286" fill="none" stroke="#76d9e8" stroke-opacity="0.14" stroke-width="1"/>
