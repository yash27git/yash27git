  <g><circle cx="1103" cy="67" r="5" fill="#57e4ca"/><circle cx="1142" cy="104" r="3" fill="#8b9dff"/><circle cx="895" cy="244" r="4" fill="#57c9ff"/><circle cx="1073" cy="249" r="3" fill="#a2b0ff"/></g>
